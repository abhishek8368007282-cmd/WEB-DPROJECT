<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send a Message — Noxara</title>
    <link rel="icon" href="icon.jpg">
    <link rel="stylesheet" href="msg.css">
</head>
<body>

 <div class="page">
        <div class="card">

            <a href="website-content.html#btn-group" class="back">← Back</a>

            <p class="eyebrow">Get in touch</p>
            <h1>Send us a message</h1>

            <div id="form-body">
                <div class="row">
                    <div class="field">
                        <label>Your name</label>
                        <input type="text" id="name" placeholder="Abc...." />
                    </div>
                    <div class="field">
                        <label>Your email</label>
                        <input type="email" id="email" placeholder="Example@web.com" />
                    </div>
                </div>

                <div class="field">
                    <label>Company / project name (optional)</label>
                    <input type="text" placeholder="e.g. Acme Inc." />
                </div>

                <div class="field">
                    <label>What are you building?</label>
                    <textarea id="message" placeholder="Give us a rough idea......."></textarea>
                </div>

                <div class="field">
                    <label>Budget range (optional)</label>
                    <select>
                        <option value="" disabled selected>Select a range</option>
                        <option>Under $5,000</option>
                        <option>$5,000 - $15,000</option>
                        <option>$15,000 - $50,000</option>
                        <option>$50,000+</option>
                        <option>Not sure yet</option>
                    </select>
                </div>

                <button class="btn">Send message →</button>
            </div>


        </div>
    </div>

</body>
</html>
