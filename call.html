<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Call — Noxara</title>
    <link rel="icon" href="icon.jpg">
    <link rel="stylesheet" href="call.css">
</head>
<body>
<div class="page">
        <div class="card">

            <a href="javascript:history.back()" class="back">← Back</a>

            <p class="eyebrow">Book a slot</p>
            <h1>Schedule a call</h1>

            <div id="form-body">
                <div class="row">
                    <div class="field">
                        <label>Your name</label>
                        <input type="text" id="name" placeholder="ABC...." />
                    </div>
                    <div class="field">
                        <label>Your email</label>
                        <input type="email" id="email" placeholder="@example.com" />
                    </div>
                </div>

                <div class="field">
                    <label>Phone number</label>
                    <input type="tel" placeholder="enter your number" />
                </div>

                <div class="field">
                    <label>Preferred date</label>
                    <input type="text" id="date" placeholder="Monday June 30" />
                </div>



                <hr>

                <div class="field">
                    <label>Anything to prep for the call?</label>
                    <textarea placeholder="e.g. We're a startup at seed stage building a marketplace for..."></textarea>
                </div>

                <button class="btn">Confirm call →</button>
            </div>


        </div>
    </div>

</body>
</html>
